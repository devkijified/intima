<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: keep the monogram inside the central 66% safe zone. -->
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C22A57"/>
      <stop offset="1" stop-color="#8F1D40"/>
    </linearGradient>
    <linearGradient id="m-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C878"/>
      <stop offset="1" stop-color="#B8943F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#m-bg)"/>
  <text x="256" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="200" font-weight="bold" fill="url(#m-gold)" text-anchor="middle" letter-spacing="3">I</text>
  <circle cx="256" cy="182" r="8" fill="url(#m-gold)"/>
</svg>
